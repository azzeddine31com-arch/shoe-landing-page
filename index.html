<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>OBIDER | حذاء أمان بخفة رياضية</title>
  <link rel="preload" href="Main%20video/hero-1080-edc27943d1ea.avif" as="image" type="image/avif" fetchpriority="high">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg-dark: #090a0f;
      --bg-navy: #101a29;
      --accent-gold: #ffd700;
      --accent-gold-glow: rgba(255, 215, 0, 0.4);
      --accent-gold-soft: #ff9900;
      --text-primary: #ffffff;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --gradient-overlay: linear-gradient(180deg, rgba(9, 10, 15, 0) 0%, rgba(9, 10, 15, 0.75) 40%, rgba(9, 10, 15, 0.98) 100%);
      --font-headline: 'Alexandria', system-ui, sans-serif;
      --font-body: 'Tajawal', system-ui, sans-serif;
      --h1-size: clamp(1.75rem, 5vw, 2.25rem);
      --h2-size: clamp(1.35rem, 4vw, 1.75rem);
      --body-size: clamp(0.875rem, 2.5vw, 1rem);
      --zone-header-height: 12vh;
      --zone-product-height: 58vh;
      --zone-content-height: 30vh;
      --content-max: 640px;
      --cta-height: 54px;
      --cta-reserve: 4.6rem;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: var(--font-body);
      background: var(--bg-dark);
      color: var(--text-primary);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg-dark);
      -webkit-tap-highlight-color: transparent;
    }

    button, input, select { font: inherit; }

    #story {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow-x: hidden;
      overflow-y: scroll;
      overscroll-behavior: contain;
      scrollbar-width: none;
      background: var(--bg-dark);
      touch-action: none;
    }

    #story::-webkit-scrollbar { display: none; }

    .section {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: var(--bg-dark);
    }

    .hero {
      background: radial-gradient(ellipse at 50% 32%, #1d2a3c 0%, #101722 42%, var(--bg-dark) 100%);
    }

    .hero picture { display: block; width: 100%; height: 100%; }

    .hero img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 220ms ease-out;
    }

    .hero img.is-loaded { opacity: 1; }

    #frame-container {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      visibility: hidden;
      opacity: 1;
      pointer-events: none;
      transition: opacity 200ms ease-out;
      background: #000;
    }

    #frame-container.is-fading { opacity: 0; }

    #frame-canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #particle-canvas {
      position: fixed;
      z-index: 11;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      visibility: hidden;
      pointer-events: none;
    }

    #gradient-overlay {
      position: fixed;
      z-index: 20;
      inset: auto 0 0;
      height: 45vh;
      height: 45svh;
      pointer-events: none;
      opacity: 1;
      background: var(--gradient-overlay);
      transition: opacity .6s cubic-bezier(.2, .8, .2, 1) .1s;
    }

    #gradient-overlay.is-dimmed {
      opacity: .2;
      transition: opacity .2s ease-out;
    }

    .section-copy {
      position: absolute;
      z-index: 30;
      inset: auto 0 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      width: 100%;
      height: auto;
      min-height: var(--zone-content-height);
      padding: 0 max(1.25rem, calc((100vw - var(--content-max)) / 2)) calc(1.5rem + var(--cta-reserve) + var(--safe-bottom));
      text-align: right;
      pointer-events: none;
    }

    .section-copy > * { pointer-events: auto; }

    .fixed-ui-layer {
      position: fixed;
      z-index: 30;
      inset: 0;
      pointer-events: none;
    }

    #dynamic-text-container {
      position: absolute;
      z-index: 30;
      inset: auto 0 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      width: 100%;
      min-height: var(--zone-content-height);
      padding: 0 max(1.25rem, calc((100vw - var(--content-max)) / 2)) calc(1.5rem + var(--cta-reserve) + var(--safe-bottom));
      direction: rtl;
      text-align: right;
      pointer-events: none;
    }

    .text-hidden { pointer-events: none; }
    .text-hidden > * { pointer-events: none !important; }
    .text-hidden .feature-tag, .text-hidden h2, .text-hidden p {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity .3s ease-out, transform .3s ease-out;
    }

    .text-visible .feature-tag, .text-visible h2, .text-visible p {
      opacity: 1;
      transform: translateY(0);
    }

    .text-visible .feature-tag { transition: opacity .7s cubic-bezier(.16, 1, .3, 1), transform .7s cubic-bezier(.16, 1, .3, 1); }
    .text-visible h2 { transition: opacity .7s cubic-bezier(.16, 1, .3, 1), transform .7s cubic-bezier(.16, 1, .3, 1); }
    .text-visible p { transition: opacity .7s cubic-bezier(.16, 1, .3, 1) .15s, transform .7s cubic-bezier(.16, 1, .3, 1) .15s; }
    .text-visible.technical-section .highlight { color: #00e5ff; }

    .ui-container {
      transition: opacity .2s ease-out, transform .2s ease-out;
      opacity: 1;
      transform: translateY(0);
      will-change: opacity, transform;
    }

    .ui-hidden {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity .2s ease-in, transform .2s ease-in;
      pointer-events: none;
    }

    .ui-hidden > * { pointer-events: none !important; }

    .ui-visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity .4s cubic-bezier(.2, .8, .2, 1) .1s, transform .4s cubic-bezier(.2, .8, .2, 1) .1s;
    }

    .ui-container h1, .ui-container h2, .ui-container .copy-body {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .4s cubic-bezier(.2, .8, .2, 1), transform .4s cubic-bezier(.2, .8, .2, 1);
    }

    .ui-container:not(.ui-visible) h1,
    .ui-container:not(.ui-visible) h2,
    .ui-container:not(.ui-visible) .copy-body {
      transition-duration: .2s;
      transition-timing-function: ease-in;
    }

    .ui-container.ui-visible h1,
    .ui-container.ui-visible h2,
    .ui-container.ui-visible .copy-body {
      opacity: 1;
      transform: translateY(0);
    }

    .ui-container.ui-visible .copy-body { transition-delay: .1s; }

    .hero-copy { min-height: var(--zone-content-height); padding-bottom: calc(1.5rem + var(--safe-bottom)); }

    .feature-tag {
      display: inline-block;
      margin: 0 0 .5rem;
      padding: .25rem .75rem;
      border: 1px solid var(--accent-gold);
      border-radius: 20px;
      background: rgba(255, 215, 0, .15);
      color: var(--accent-gold);
      font-size: .75rem;
      font-weight: 700;
      line-height: 1.5;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      max-width: 580px;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-family: var(--font-headline);
      font-size: var(--h1-size);
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: -.035em;
      text-wrap: balance;
    }

    h2 {
      max-width: 590px;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-family: var(--font-headline);
      font-size: var(--h2-size);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -.025em;
      text-wrap: balance;
    }

    .highlight { color: var(--accent-gold); font-weight: 700; }
    .technical-section .highlight { color: #00e5ff; }

    .copy-body {
      max-width: 560px;
      margin: 0;
      color: var(--text-secondary);
      font-size: var(--body-size);
      font-weight: 400;
      line-height: 1.65;
      text-wrap: pretty;
    }

    .trust-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0 0 11px;
      padding: 6px 11px;
      border: 1px solid rgba(255, 215, 0, .34);
      border-radius: 999px;
      background: rgba(9, 12, 17, .74);
      color: #f5e6a6;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.25;
      backdrop-filter: blur(8px);
    }

    .trust-badge::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      content: "";
      background: var(--accent-gold);
      box-shadow: 0 0 10px rgba(255, 215, 0, .75);
    }

    .cta-wrapper { width: 100%; margin-top: .75rem; }

    .hero-cta-liquid {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      width: 100%;
      height: 54px;
      margin: 0;
      padding: 0 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 0, .72);
      border-radius: 12px;
      background: linear-gradient(115deg, #ffd700 0%, #ff9900 52%, #ffd700 100%);
      background-size: 200% 100%;
      box-shadow: 0 0 25px rgba(255, 215, 0, .5);
      color: #090a0f;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      direction: rtl;
      animation: liquid-background 5s ease-in-out infinite, liquid-glow 2.8s ease-in-out infinite alternate;
    }

    .hero-cta-liquid::before {
      position: absolute;
      z-index: 0;
      inset: 0;
      content: "";
      background: linear-gradient(115deg, transparent 18%, rgba(9,10,15,.38) 48%, transparent 76%);
      background-size: 200% 100%;
      animation: liquid-sheen 4s ease-in-out infinite;
      pointer-events: none;
    }

    .hero-cta-liquid .btn-text, .hero-cta-liquid .btn-icon { position: relative; z-index: 1; }
    .hero-cta-liquid .btn-icon { display: inline-flex; flex: 0 0 auto; }
    .hero-cta-liquid .btn-icon svg { width: 20px; height: 20px; }
    .hero-cta-liquid:active { transform: scale(.98); }

    @keyframes liquid-background {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes liquid-sheen {
      0%, 100% { background-position: 100% 50%; }
      50% { background-position: 0% 50%; }
    }

    @keyframes liquid-glow {
      0% { box-shadow: 0 0 16px rgba(255, 215, 0, .38); }
      100% { box-shadow: 0 0 25px rgba(255, 215, 0, .5); }
    }

    .btn-sticky-glass {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: var(--content-max);
      min-height: 48px;
      margin: 0;
      padding: 9px 18px;
      border: 1px solid rgba(255, 215, 0, .3);
      border-radius: 14px;
      background: rgba(255, 255, 255, .1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 18px rgba(255, 215, 0, .11);
      color: #fff;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .btn-sticky-glass:hover { background: rgba(255, 255, 255, .16); }
    .btn-sticky-glass:active { transform: scale(.985); }

    .btn-form-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      margin: 12px 0 0;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffd700, #ff9900);
      color: #090a0f;
      cursor: pointer;
      font-family: var(--font-body);
      font-weight: 700;
    }

    .hero-cta-liquid:focus-visible, .btn-sticky-glass:focus-visible, .btn-form-submit:focus-visible,
    .close-dialog:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    #sticky-cta {
      position: absolute;
      z-index: 40;
      right: max(18px, calc((100vw - var(--content-max)) / 2));
      bottom: calc(10px + var(--safe-bottom));
      left: max(18px, calc((100vw - var(--content-max)) / 2));
      width: auto;
      margin-inline: auto;
      transition: all .5s cubic-bezier(.4, 0, .2, 1);
    }

    #sticky-cta.hidden-in-hero {
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
    }

    #sticky-cta.visible-in-scroll {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    #order-dialog {
      width: min(100% - 28px, 530px);
      max-width: 530px;
      max-height: min(92svh, 900px);
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 0, .45);
      border-radius: 22px;
      background: #0b0d11;
      color: var(--text-primary);
      box-shadow: 0 24px 90px rgba(0,0,0,.75), 0 0 34px rgba(255,215,0,.12);
    }

    #order-dialog::backdrop { background: rgba(0,0,0,.76); backdrop-filter: blur(8px); }

    .order-scroll {
      max-height: min(92svh, 900px);
      overflow-y: auto;
      padding: 22px 20px 20px;
      scrollbar-color: #66530c #111;
    }

    .order-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom: 17px; }
    .order-heading h2 { margin: 0 0 4px; font-size: 25px; }
    .order-heading p { margin: 0; color: var(--text-secondary); font-size: 14px; }
    .close-dialog { flex: 0 0 auto; width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.17); border-radius: 50%; background:#171a20; color:#fff; cursor:pointer; font-size:22px; line-height:1; }
    .order-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .field.full { grid-column:1/-1; }
    .field label, .field-label { color:#e7eaf0; font-size:13px; font-weight:700; }
    .field input, .field select { width:100%; min-height:46px; padding:10px 12px; border:1px solid rgba(203,213,225,.28); border-radius:11px; background:#11151b; color:#fff; }
    .field input::placeholder { color:#788391; }
    .color-options { display:flex; flex-wrap:wrap; gap:8px; }
    .color-option { display:flex; align-items:center; gap:7px; padding:8px 10px; border:1px solid rgba(203,213,225,.25); border-radius:999px; color:#e8ecf2; font-size:13px; cursor:pointer; }
    .color-option:has(input:checked) { border-color:var(--accent-gold); color:var(--accent-gold); }
    .color-option input { accent-color:var(--accent-gold); }
    .order-note { margin:13px 0 0; color:var(--text-muted); font-size:12px; line-height:1.55; }
    #order-status { min-height:20px; margin:9px 0 0; color:#f4d767; font-size:13px; }

    @media (max-width: 380px) {
      .section-copy { padding-right: 18px; padding-left: 18px; }
      .order-grid { grid-template-columns:1fr; }
      .field.full { grid-column:auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

      <template class="section-copy-template"><span class="feature-tag">الوزن والرياضة</span><h2>قوة العمل بـ <span class="highlight">خفة الرياضة</span>.</h2><p class="copy-body">وزن خفيف للغاية (~366 غرام) يمنحك حرية حركة كاملة طوال اليوم.</p></template>
    </section>
    <section class="section video-section technical-section" aria-label="المعايير الأوروبية" data-video="9" data-duration="2.53" data-forward="transition-09-forward.mp4" data-reverse="transition-09-reverse.mp4" data-anchor="section-09-anchor.webp">
      <template class="section-copy-template"><span class="feature-tag">المعايير الأوروبية</span><h2>هندسة أمان <span class="highlight">معتمدة</span>.</h2><p class="copy-body">مصمم وفق معايير السلامة الأوروبية (EN ISO 20345) لجودة وموثوقية عالية.</p></template>
    </section>
    <section class="section video-section technical-section" aria-label="العرض النهائي" data-video="10" data-duration="2.53" data-forward="transition-10-forward.mp4" data-reverse="transition-10-reverse.mp4" data-anchor="section-10-anchor.webp">
      <template class="section-copy-template"><span class="feature-tag">العرض النهائي</span><h2>كل ما تحتاجه في <span class="highlight">حذاء واحد</span>.</h2><p class="copy-body">الحماية، الراحة، الخفة، والسرعة. احمِ نفسك في موقع العمل الآن.</p></template>
    </section>
    <section class="section video-section silent-section" aria-label="المشهد الختامي" data-index="11" data-title="" data-body="" data-cta="false" data-video="11" data-duration="3.22" data-forward="transition-11-forward.mp4" data-reverse="transition-11-reverse.mp4" data-anchor="section-11-anchor.webp"></section>
  </main>

  <div id="frame-container" aria-hidden="true"><canvas id="frame-canvas"></canvas></div>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div id="gradient-overlay" aria-hidden="true"></div>
  <div class="fixed-ui-layer" aria-label="واجهة الشراء">
    <div id="dynamic-text-container" class="text-hidden" aria-live="polite" aria-atomic="true" aria-hidden="true"></div>
    <button id="sticky-cta" class="btn-sticky-glass hidden-in-hero" type="button" aria-hidden="true" tabindex="-1" onclick="scrollToOrderForm()">اطلب الآن - الدفع عند الاستلام</button>
  </div>

  <dialog id="order-dialog" aria-labelledby="order-title">
    <div class="order-scroll">
      <div class="order-heading">
        <div><h2 id="order-title">أكمل طلبك</h2><p>أدخل بياناتك لاختيار تفاصيل الحذاء.</p></div>
        <button class="close-dialog" type="button" aria-label="إغلاق" onclick="closeOrderForm()">×</button>
      </div>
      <form id="order-form">
        <div class="order-grid">
          <div class="field full"><label for="customer-name">الاسم الكامل</label><input id="customer-name" name="name" autocomplete="name" placeholder="اكتب اسمك الكامل" required></div>
          <div class="field"><label for="customer-phone">رقم الهاتف</label><input id="customer-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05 / 06 / 07..." required></div>
          <div class="field"><label for="customer-wilaya">الولاية</label><input id="customer-wilaya" name="wilaya" autocomplete="address-level1" placeholder="اكتب ولايتك" required></div>
          <div class="field full"><label for="customer-city">البلدية</label><input id="customer-city" name="city" autocomplete="address-level2" placeholder="اكتب بلديتك" required></div>
          <div class="field full"><span class="field-label">اللون</span><div class="color-options" role="radiogroup" aria-label="اختر اللون">
            <label class="color-option"><input type="radio" name="color" value="رمادي" required> رمادي</label>
            <label class="color-option"><input type="radio" name="color" value="أسود"> أسود</label>
            <label class="color-option"><input type="radio" name="color" value="أبيض"> أبيض</label>
          </div></div>
          <div class="field"><label for="shoe-size">المقاس</label><select id="shoe-size" name="size" required><option value="">اختر المقاس</option><option>40</option><option>41</option><option>42</option><option>43</option><option>44</option><option>45</option></select></div>
          <div class="field"><label for="quantity">الكمية</label><input id="quantity" name="quantity" type="number" min="1" max="10" value="1" required></div>
        </div>
        <p class="order-note">الدفع عند الاستلام. لم يتم ربط هذا النموذج بخدمة استقبال الطلبات بعد.</p>
        <button class="btn-form-submit" type="submit">إتمام الطلب</button>
        <p id="order-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </dialog>

  <script>
    const story = document.querySelector('#story');
    const frameContainer = document.querySelector('#frame-container');
    const canvas = document.querySelector('#frame-canvas');
    const context = canvas.getContext('2d', { alpha: false });
    const particleCanvas = document.querySelector('#particle-canvas');
    const particleContext = particleCanvas.getContext('2d');
    const gradientOverlay = document.querySelector('#gradient-overlay');
    const sections = Array.from(story.querySelectorAll('.section'));
    const heroImage = document.querySelector('.hero img');
    const heroCopy = document.querySelector('.hero-copy');
    const dynamicTextContainer = document.querySelector('#dynamic-text-container');
    const stickyCta = document.querySelector('#sticky-cta');
    const orderDialog = document.querySelector('#order-dialog');
    let currentSection = 0;
    let activeVideo = null;
    let activeTransitionId = 0;
    let transitionSafetyTimer = null;
    let wheelQuietTimer = null;
    let wheelInputActive = false;
    let touchStart = null;
    let fadeTimer = null;
    let isScrollingLocked = false;
    let lastCanvasSource = null;
    let lastCanvasWidth = 0;
    let lastCanvasHeight = 0;
    let lastOrderTrigger = null;
    let particleAnimationFrame = 0;
    let particleLastFrameTime = 0;
    let heroParticles = [];
    let transitionRevealTriggered = false;

    const tracks = Array.from(story.querySelectorAll('.video-section')).map((section, index) => {
      const makeVideo = (file) => {
        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.preload = 'auto';
        video.controls = false;
        video.loop = false;
        video.disablePictureInPicture = true;
        video.setAttribute('aria-hidden', 'true');
        video.src = new URL(`Main%20video/transitions/${file}`, document.baseURI).href;
        video.load();
        return video;
      };
      const anchor = new Image();
      anchor.decoding = 'async';
      anchor.loading = 'eager';
      anchor.fetchPriority = 'high';
      anchor.src = new URL(`Main%20video/transitions/${section.dataset.anchor}`, document.baseURI).href;
      const track = {
        section,
        index,
        number: Number(section.dataset.video),
        duration: Number(section.dataset.duration),
        forward: makeVideo(section.dataset.forward),
        reverse: makeVideo(section.dataset.reverse),
        anchor
      };
      anchor.onload = () => {
        if (!isScrollingLocked && currentSection === track.index + 1) {
          drawCoverSource(anchor, anchor.naturalWidth, anchor.naturalHeight);
        }
      };
      return track;
    });

    function seedHeroParticles() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      heroParticles = Array.from({ length: 18 }, () => ({
        x: width * (.5 + (Math.random() - .5) * .34),
        y: height * (.52 + Math.random() * .43),
        speed: 28 + Math.random() * 62,
        radius: .8 + Math.random() * 1.5,
        alpha: .22 + Math.random() * .42,
        phase: Math.random() * Math.PI * 2,
        frequency: .7 + Math.random() * .8
      }));
    }

    function stopHeroParticles() {
      if (particleAnimationFrame) window.cancelAnimationFrame(particleAnimationFrame);
      particleAnimationFrame = 0;
      heroParticles = [];
      particleCanvas.style.visibility = 'hidden';
      particleContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }

    function renderHeroParticles(now) {
      if (currentSection !== 0 || isScrollingLocked || orderDialog.open || !particleContext) {
        stopHeroParticles();
        return;
      }
      const width = window.innerWidth;
      const height = window.innerHeight;
      const delta = Math.min((now - particleLastFrameTime) / 1000, .05);
      particleLastFrameTime = now;
      particleContext.clearRect(0, 0, width, height);
      heroParticles.forEach((particle) => {
        particle.y -= particle.speed * delta;
        particle.x += Math.sin(now * .001 * particle.frequency + particle.phase) * 5 * delta;
        if (particle.y < 0) {
          particle.x = width * (.5 + (Math.random() - .5) * .34);
          particle.y = height * (.84 + Math.random() * .18);
          particle.speed = 28 + Math.random() * 62;
          particle.radius = .8 + Math.random() * 1.5;
          particle.alpha = .22 + Math.random() * .42;
          particle.phase = Math.random() * Math.PI * 2;
          particle.frequency = .7 + Math.random() * .8;
        }
        const yFade = Math.max(0, Math.min(1, particle.y / (height * .86)));
        particleContext.beginPath();
        particleContext.fillStyle = `rgba(0, 229, 255, ${particle.alpha * yFade})`;
        particleContext.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        particleContext.fill();
      });
      particleAnimationFrame = window.requestAnimationFrame(renderHeroParticles);
    }

    function startHeroParticles() {
      if (currentSection !== 0 || isScrollingLocked || orderDialog.open || !particleContext) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (particleAnimationFrame) return;
      seedHeroParticles();
      particleCanvas.style.visibility = 'visible';
      particleLastFrameTime = performance.now();
      particleAnimationFrame = window.requestAnimationFrame(renderHeroParticles);
    }

    function revealHero() {
      heroImage.classList.add('is-loaded');
      if (currentSection === 0 && !activeVideo) {
        drawHeroPoster();
        startHeroParticles();
      }
    }
    if (heroImage.complete && heroImage.naturalWidth > 0) revealHero();
    else heroImage.addEventListener('load', revealHero, { once: true });

    function getSectionHeight() {
      return sections[0]?.offsetHeight || story.clientHeight || window.innerHeight;
    }

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.round(window.innerWidth * ratio));
      const height = Math.max(1, Math.round(window.innerHeight * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        if (lastCanvasSource && lastCanvasWidth && lastCanvasHeight) {
          drawCoverSource(lastCanvasSource, lastCanvasWidth, lastCanvasHeight);
        } else if (currentSection === 0) {
          drawHeroPoster();
        }
      }
      if (particleCanvas.width !== width || particleCanvas.height !== height) {
        particleCanvas.width = width;
        particleCanvas.height = height;
        particleContext.setTransform(ratio, 0, 0, ratio, 0, 0);
        if (currentSection === 0 && heroImage.complete && heroImage.naturalWidth) {
          seedHeroParticles();
        }
      }
      sections.forEach((section) => { section.style.height = `${window.innerHeight}px`; });
      if (!isScrollingLocked) story.scrollTop = currentSection * getSectionHeight();
    }

    function drawCoverSource(source, sourceWidth, sourceHeight) {
      if (!sourceWidth || !sourceHeight) return false;
      const sourceAspect = sourceWidth / sourceHeight;
      const canvasAspect = canvas.width / canvas.height;
      let sx = 0;
      let sy = 0;
      let sw = sourceWidth;
      let sh = sourceHeight;
      if (sourceAspect > canvasAspect) {
        sw = sourceHeight * canvasAspect;
        sx = (sourceWidth - sw) / 2;
      } else {
        sh = sourceWidth / canvasAspect;
        sy = (sourceHeight - sh) / 2;
      }
      try {
        context.drawImage(source, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
        lastCanvasSource = source;
        lastCanvasWidth = sourceWidth;
        lastCanvasHeight = sourceHeight;
        frameContainer.classList.remove('is-fading');
        frameContainer.style.visibility = 'visible';
        frameContainer.setAttribute('data-has-frame', 'true');
        return true;
      } catch (error) {
        console.warn('Could not draw the transition frame:', error);
        return false;
      }
    }

    function drawCover(video) { return drawCoverSource(video, video.videoWidth, video.videoHeight); }
    function drawHeroPoster() {
      if (!heroImage.complete || !heroImage.naturalWidth) return false;
      return drawCoverSource(heroImage, heroImage.naturalWidth, heroImage.naturalHeight);
    }

    function drawAnchor(sectionIndex) {
      if (sectionIndex === 0) return drawHeroPoster();
      const track = tracks[sectionIndex - 1];
      if (!track || !track.anchor.complete || !track.anchor.naturalWidth) return false;
      return drawCoverSource(track.anchor, track.anchor.naturalWidth, track.anchor.naturalHeight);
    }

    function fadeBackToHero(transitionId) {
      frameContainer.classList.add('is-fading');
      if (fadeTimer) window.clearTimeout(fadeTimer);
      fadeTimer = window.setTimeout(() => {
        if (transitionId !== activeTransitionId || currentSection !== 0) return;
        frameContainer.style.visibility = 'hidden';
        frameContainer.removeAttribute('data-has-frame');
        frameContainer.classList.remove('is-fading');
      }, 220);
    }

    function hideUiDuringTransition() {
      heroCopy.classList.remove('ui-visible');
      heroCopy.classList.add('ui-hidden');
      dynamicTextContainer.className = 'text-hidden';
      dynamicTextContainer.setAttribute('aria-hidden', 'true');
    }

    function prepareSectionCopy(sectionIndex) {
      dynamicTextContainer.replaceChildren();
      const template = sections[sectionIndex]?.querySelector('.section-copy-template');
      if (!template) return;
      const fragment = template.content.cloneNode(true);
      const heading = fragment.querySelector('h2');
      const description = fragment.querySelector('p');
      if (heading) heading.id = 'section-title';
      if (description) description.id = 'section-desc';
      dynamicTextContainer.append(fragment);
    }

    function revealSectionUi(sectionIndex) {
      const isHero = sectionIndex === 0;
      if (isHero) {
        heroCopy.classList.remove('ui-hidden');
        heroCopy.classList.add('ui-visible');
      } else {
        heroCopy.classList.remove('ui-visible');
        heroCopy.classList.add('ui-hidden');
      }

      const hasFeatureCopy = sectionIndex > 0 && sectionIndex < sections.length - 1
        && Boolean(dynamicTextContainer.querySelector('#section-title'));
      if (hasFeatureCopy) {
        const isTechnicalSlide = sections[sectionIndex].classList.contains('technical-section');
        dynamicTextContainer.className = isTechnicalSlide ? 'text-visible technical-section' : 'text-visible';
      } else {
        dynamicTextContainer.className = 'text-hidden';
      }
      dynamicTextContainer.setAttribute('aria-hidden', String(!hasFeatureCopy));

      const showStickyCta = sectionIndex > 0 && sectionIndex < sections.length - 1;
      stickyCta.classList.toggle('hidden-in-hero', !showStickyCta);
      stickyCta.classList.toggle('visible-in-scroll', showStickyCta);
      stickyCta.setAttribute('aria-hidden', String(!showStickyCta));
      stickyCta.tabIndex = showStickyCta ? 0 : -1;
    }

    function triggerTextReveal(destination, transitionId) {
      if (transitionId !== activeTransitionId || !isScrollingLocked || transitionRevealTriggered) return;
      transitionRevealTriggered = true;
      story.scrollTop = destination * getSectionHeight();
      gradientOverlay.classList.remove('is-dimmed');
      revealSectionUi(destination);
    }

    function finishTransition(video, destination, transitionId) {
      if (transitionId !== activeTransitionId || !isScrollingLocked) return;
      if (transitionSafetyTimer) window.clearTimeout(transitionSafetyTimer);
      video.pause();
      if (!drawAnchor(destination)) drawCover(video);
      if (!transitionRevealTriggered) triggerTextReveal(destination, transitionId);
      story.scrollTop = destination * getSectionHeight();
      currentSection = destination;
      isScrollingLocked = false;
      activeVideo = null;
      activeTransitionId += 1;
      if (destination === 0) {
        fadeBackToHero(activeTransitionId);
        startHeroParticles();
      } else {
        stopHeroParticles();
      }
    }

    function renderTransition(video, destination, transitionId, fallbackDuration) {
      const startedAt = performance.now();
      const render = () => {
        if (transitionId !== activeTransitionId || !isScrollingLocked) return;
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) drawCover(video);
        const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : fallbackDuration;
        if (!transitionRevealTriggered && video.currentTime >= duration - 0.4) {
          triggerTextReveal(destination, transitionId);
        }
        if (video.currentTime >= duration - 0.1) { finishTransition(video, destination, transitionId); return; }
        if (video.error || performance.now() - startedAt > (duration + 1.25) * 1000) { finishTransition(video, destination, transitionId); return; }
        window.requestAnimationFrame(render);
      };
      window.requestAnimationFrame(render);
    }

    function playTransition(step, origin, destination) {
      const track = step > 0 ? tracks[destination - 1] : tracks[origin - 1];
      if (!track) return;
      const video = step > 0 ? track.forward : track.reverse;
      const transitionId = ++activeTransitionId;
      if (fadeTimer) window.clearTimeout(fadeTimer);
      frameContainer.classList.remove('is-fading');
      transitionRevealTriggered = false;
      activeVideo = video;
      try { video.currentTime = 0; } catch (_) { /* Metadata may not be ready yet. */ }
      const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : track.duration;
      transitionSafetyTimer = window.setTimeout(() => finishTransition(video, destination, transitionId), (duration + 1.25) * 1000);
      try {
        const playback = video.play();
        if (playback && typeof playback.catch === 'function') playback.catch((error) => {
          if (transitionId === activeTransitionId) {
            console.warn('Transition video could not play:', error);
            finishTransition(video, destination, transitionId);
          }
        });
      } catch (error) {
        console.warn('Transition video could not start:', error);
        finishTransition(video, destination, transitionId);
      }
      renderTransition(video, destination, transitionId, duration);
    }

    function navigate(step) {
      if (isScrollingLocked || orderDialog.open) return;
      const origin = currentSection;
      const destination = Math.max(0, Math.min(sections.length - 1, origin + step));
      if (destination === origin) return;
      hideUiDuringTransition();
      prepareSectionCopy(destination);
      gradientOverlay.classList.add('is-dimmed');
      stopHeroParticles();
      isScrollingLocked = true;
      playTransition(step, origin, destination);
    }

    function handleWheel(event) {
      if (orderDialog.open) return;
      event.preventDefault();
      const step = event.deltaY > 0 ? 1 : event.deltaY < 0 ? -1 : 0;
      if (step && !wheelInputActive) {
        wheelInputActive = true;
        navigate(step);
      }
      if (wheelQuietTimer) window.clearTimeout(wheelQuietTimer);
      wheelQuietTimer = window.setTimeout(() => { wheelInputActive = false; }, 320);
    }

    window.addEventListener('wheel', handleWheel, { passive: false });
    window.addEventListener('touchstart', (event) => {
      if (orderDialog.open) return;
      if (event.target instanceof Element && event.target.closest('button, a, input, select, textarea')) { touchStart = null; return; }
      if (!event.touches.length) return;
      event.preventDefault();
      touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    }, { passive: false });
    window.addEventListener('touchmove', (event) => {
      if (orderDialog.open || !touchStart || !event.touches.length) return;
      event.preventDefault();
      const deltaY = touchStart.y - event.touches[0].clientY;
      const deltaX = touchStart.x - event.touches[0].clientX;
      if (Math.abs(deltaY) >= 24 && Math.abs(deltaY) > Math.abs(deltaX)) {
        const step = deltaY > 0 ? 1 : -1;
        touchStart = null;
        navigate(step);
      }
    }, { passive: false });
    window.addEventListener('touchend', (event) => {
      if (orderDialog.open || !touchStart || !event.changedTouches.length) return;
      event.preventDefault();
      const deltaY = touchStart.y - event.changedTouches[0].clientY;
      const deltaX = touchStart.x - event.changedTouches[0].clientX;
      touchStart = null;
      if (Math.abs(deltaY) >= 24 && Math.abs(deltaY) > Math.abs(deltaX)) navigate(deltaY > 0 ? 1 : -1);
    }, { passive: false });
    window.addEventListener('touchcancel', () => { touchStart = null; }, { passive: true });

    window.addEventListener('keydown', (event) => {
      if (orderDialog.open) return;
      if (['ArrowDown', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
        if (!event.repeat) navigate(1);
      } else if (['ArrowUp', 'PageUp'].includes(event.key)) {
        event.preventDefault();
        if (!event.repeat) navigate(-1);
      }
    });

    function scrollToOrderForm() {
      stopHeroParticles();
      lastOrderTrigger = document.activeElement;
      if (typeof orderDialog.showModal === 'function') orderDialog.showModal();
      else orderDialog.setAttribute('open', '');
      window.setTimeout(() => document.querySelector('#customer-name').focus(), 0);
    }

    function closeOrderForm() {
      if (typeof orderDialog.close === 'function') orderDialog.close();
      else orderDialog.removeAttribute('open');
      if (lastOrderTrigger && typeof lastOrderTrigger.focus === 'function') lastOrderTrigger.focus();
      if (currentSection === 0 && !isScrollingLocked) startHeroParticles();
    }

    orderDialog.addEventListener('close', () => {
      if (currentSection === 0 && !isScrollingLocked) startHeroParticles();
    });

    document.querySelector('#order-form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#order-status').textContent = 'تعذّر إرسال الطلب: لم يتم ربط النموذج بخدمة استقبال الطلبات.';
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
